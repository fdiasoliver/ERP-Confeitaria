<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitrine — Wireframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/wireframe.css">
</head>
<body>
  <span class="wf-label">WIREFRAME — Vitrine</span>
  <a href="index.html" class="back-link">← Voltar aos wireframes</a>

  <div class="app-shell">
    <header class="app-header">
      <div class="logo">Doce Menina</div>
      <div class="header-actions">
        <button class="icon-btn" aria-label="Buscar">🔍</button>
        <button class="icon-btn" aria-label="Perfil">👤</button>
        <button class="icon-btn cart-btn" aria-label="Carrinho">
          🛒
          <span class="cart-badge">3</span>
        </button>
      </div>
    </header>

    <div class="chips">
      <button class="chip active">Todos</button>
      <button class="chip">Aniversário</button>
      <button class="chip">Docinhos</button>
      <button class="chip">Café</button>
      <button class="chip">Casamento</button>
      <button class="chip">Corporativo</button>
      <button class="chip">Mesversário</button>
    </div>

    <section class="section">
      <h2 class="section-title">Destaques</h2>
      <div class="product-grid">
        <article class="product-card">
          <div class="product-img">🎂</div>
          <div class="product-body">
            <div class="product-name">Bolo Red Velvet</div>
            <div class="product-price">R$ 180,00 · 3 dias</div>
            <div class="qty-control">
              <button class="qty-btn">−</button>
              <span class="qty-value">1</span>
              <button class="qty-btn">+</button>
            </div>
          </div>
        </article>
        <article class="product-card">
          <div class="product-img">🧁</div>
          <div class="product-body">
            <div class="product-name">Brigadeiro Gourmet</div>
            <div class="product-price">R$ 3,50/un · 1 dia</div>
            <div class="qty-control">
              <button class="qty-btn">−</button>
              <span class="qty-value">24</span>
              <button class="qty-btn">+</button>
            </div>
          </div>
        </article>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Bolos de Aniversário</h2>
      <div class="product-grid">
        <article class="product-card">
          <div class="product-img">🎂</div>
          <div class="product-body">
            <div class="product-name">Bolo Chocolate 25cm</div>
            <div class="product-price">R$ 145,00 · 3 dias</div>
            <div class="qty-control">
              <button class="qty-btn">−</button>
              <span class="qty-value">0</span>
              <button class="qty-btn">+</button>
            </div>
          </div>
        </article>
        <article class="product-card">
          <div class="product-img">🎂</div>
          <div class="product-body">
            <div class="product-name">Naked Cake Frutas</div>
            <div class="product-price">R$ 195,00 · 4 dias</div>
            <div class="qty-control">
              <button class="qty-btn">−</button>
              <span class="qty-value">0</span>
              <button class="qty-btn">+</button>
            </div>
          </div>
        </article>
      </div>
    </section>
  </div>

  <a href="carrinho.html" class="cart-fab">
    🛒 <span>3 itens · R$ 264,00</span>
  </a>
</body>
</html>
